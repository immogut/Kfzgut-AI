<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — KfzGut-AI</title>
<style>
:root{
  --stahl:#1B2530;--stahl-70:#46525F;--papier:#FAFAF8;--blatt:#FFFFFF;
  --linie:#DDE1E4;--signal:#E8590C;--signal-tint:#FFF0E6;
  --gruen:#2F9E44;--gelb:#E8A000;--rot:#D9363E;
  --gruen-bg:#EBF7EE;--gelb-bg:#FFF6E0;--rot-bg:#FDEEEE;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--papier);color:var(--stahl);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:6px;padding:9px 16px;font-weight:600}
.btn-primary{background:var(--signal);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--linie);color:var(--stahl)}
.btn-ghost:hover{border-color:var(--stahl)}
.btn-danger{background:var(--rot-bg);color:var(--rot)}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--linie);border-radius:6px;background:#fff;width:100%;color:var(--stahl)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--signal)}
label{display:block;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--stahl-70);margin-bottom:5px}

/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--blatt);border:1px solid var(--linie);border-radius:12px;padding:34px;width:100%;max-width:380px;box-shadow:0 18px 40px -20px rgba(27,37,48,.3)}
.login-box h1{font-size:21px;margin-bottom:6px;display:flex;align-items:center;gap:9px}
.mark{width:24px;height:24px;border-radius:5px;background:var(--stahl);position:relative;flex:none}
.mark::after{content:'';position:absolute;left:5px;top:5px;width:14px;height:14px;border-radius:3px;background:var(--signal)}
.login-box p{color:var(--stahl-70);font-size:13.5px;margin-bottom:22px}
.err{background:var(--rot-bg);color:var(--rot);padding:10px 12px;border-radius:6px;font-size:13.5px;margin-bottom:14px;display:none}

/* App */
#app{display:none}
.topbar{background:var(--stahl);color:#fff;padding:14px 0}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar h1{font-size:17px;display:flex;align-items:center;gap:9px}
.topbar .mark{background:#fff}
.topbar button{background:rgba(255,255,255,.12);color:#fff;padding:7px 14px;font-size:13px}

/* Kacheln */
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0}
.kachel{background:var(--blatt);border:1px solid var(--linie);border-radius:10px;padding:16px 18px}
.kachel .k-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--stahl-70);margin-bottom:7px}
.kachel .k-zahl{font-size:27px;font-weight:700;line-height:1}
.kachel.akzent{border-color:var(--signal);background:var(--signal-tint)}
.kachel.akzent .k-zahl{color:var(--signal)}
.kachel.warn .k-zahl{color:var(--gelb)}

/* Filter */
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filterbar input{max-width:280px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:20px;border:1.5px solid var(--linie);background:#fff;font-size:13px;font-weight:500}
.chip.on{background:var(--stahl);color:#fff;border-color:var(--stahl)}

/* Tabelle */
.tab-wrap{background:var(--blatt);border:1px solid var(--linie);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--stahl-70);padding:12px 14px;border-bottom:1px solid var(--linie);white-space:nowrap;background:#F4F5F4}
td{padding:12px 14px;border-bottom:1px solid #EEF0F1;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FCFCFB}
.email{font-weight:600}
.sub{font-size:12.5px;color:var(--stahl-70)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;font-family:var(--mono);white-space:nowrap}
.b-gruen{background:var(--gruen-bg);color:var(--gruen)}
.b-gelb{background:var(--gelb-bg);color:var(--gelb)}
.b-rot{background:var(--rot-bg);color:var(--rot)}
.b-grau{background:#EEF0F1;color:var(--stahl-70)}
.zeit{font-family:var(--mono);font-size:12.5px;color:var(--stahl-70);white-space:nowrap}
.leer{padding:50px 20px;text-align:center;color:var(--stahl-70)}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(27,37,48,.55);z-index:100;padding:20px;overflow:auto}
.overlay.on{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--blatt);border-radius:12px;padding:28px;width:100%;max-width:480px;margin:auto}
.modal h2{font-size:19px;margin-bottom:4px}
.modal .m-mail{font-family:var(--mono);font-size:13px;color:var(--stahl-70);margin-bottom:20px;word-break:break-all}
.feld{margin-bottom:15px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:9px;padding:11px;border:1.5px solid var(--linie);border-radius:6px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--signal)}
.check span{font-size:14px}
.modal-foot{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.modal-foot .btn-primary{flex:1}
.trial-zeile{display:flex;gap:8px;align-items:center;background:#F4F5F4;padding:12px;border-radius:6px;margin-bottom:15px}
.trial-zeile input{width:70px}
.trial-zeile span{font-size:13.5px;color:var(--stahl-70)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--stahl);color:#fff;padding:12px 22px;border-radius:8px;font-size:14px;z-index:200;display:none}
@media(max-width:700px){.zwei{grid-template-columns:1fr}th,td{padding:10px}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-box">
    <h1><span class="mark"></span>KfzGut-AI Admin</h1>
    <p>Zugang nur mit Admin-Passwort.</p>
    <div class="err" id="loginErr"></div>
    <div class="feld">
      <label for="pw">Admin-Passwort</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
    </div>
    <button class="btn-primary" style="width:100%" onclick="anmelden()">Anmelden</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <div class="topbar">
    <div class="wrap">
      <h1><span class="mark"></span>KfzGut-AI Admin</h1>
      <button onclick="abmelden()">Abmelden</button>
    </div>
  </div>

  <div class="wrap">
    <div class="kacheln" id="kacheln"></div>

    <div class="filterbar">
      <input type="search" id="suche" placeholder="E-Mail, Name oder Firma suchen…" oninput="entprellt()">
      <div class="chips" id="chips">
        <button class="chip on" data-f="alle" onclick="setFilter('alle')">Alle</button>
        <button class="chip" data-f="trial" onclick="setFilter('trial')">Im Test</button>
        <button class="chip" data-f="zahlend" onclick="setFilter('zahlend')">Zahlend</button>
        <button class="chip" data-f="unbestaetigt" onclick="setFilter('unbestaetigt')">Unbestätigt</button>
        <button class="chip" data-f="gesperrt" onclick="setFilter('gesperrt')">Gesperrt</button>
      </div>
      <button class="btn-ghost" onclick="ladeAlles()">Aktualisieren</button>
    </div>

    <div class="tab-wrap">
      <table>
        <thead><tr>
          <th>Nutzer</th><th>Plan</th><th>Status</th><th>E-Mail</th>
          <th>Test endet</th><th>Prüfungen</th><th>Registriert</th><th></th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="8" class="leer">Wird geladen…</td></tr></tbody>
      </table>
    </div>
    <div style="height:40px"></div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="overlay" id="overlay" onclick="if(event.target===this)zuMachen()">
  <div class="modal">
    <h2>Nutzer bearbeiten</h2>
    <div class="m-mail" id="mMail"></div>

    <div class="zwei">
      <div class="feld">
        <label for="mPlan">Plan</label>
        <select id="mPlan">
          <option value="trial">Test (7 Tage)</option>
          <option value="aktiv">Aktiv (bezahlt)</option>
          <option value="beendet">Beendet</option>
        </select>
      </div>
      <div class="feld">
        <label for="mStatus">Status</label>
        <select id="mStatus">
          <option value="aktiv">Aktiv</option>
          <option value="gesperrt">Gesperrt</option>
        </select>
      </div>
    </div>

    <div class="feld">
      <label for="mFirma">Firma</label>
      <input id="mFirma" type="text">
    </div>

    <div class="feld">
      <label class="check"><input type="checkbox" id="mVerified"><span>E-Mail verifiziert</span></label>
    </div>
    <div class="feld">
      <label class="check"><input type="checkbox" id="mLaunch"><span>Launch-Preis 79&nbsp;€ dauerhaft garantiert</span></label>
    </div>

    <div class="trial-zeile">
      <input type="number" id="mTage" value="7" min="1" max="365">
      <span>Tage Test verlängern</span>
      <button class="btn-ghost" style="margin-left:auto" onclick="trialVerlaengern()">Verlängern</button>
    </div>

    <div class="feld">
      <label for="mNotiz">Interne Notiz</label>
      <textarea id="mNotiz" rows="2"></textarea>
    </div>

    <div class="modal-foot">
      <button class="btn-primary" onclick="speichern()">Speichern</button>
      <button class="btn-ghost" onclick="zuMachen()">Abbrechen</button>
      <button class="btn-danger" onclick="loeschen()">Löschen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let SECRET = sessionStorage.getItem('kfzgut_admin') || '';
let FILTER = 'alle';
let AKTUELL = null;
let timer = null;

function kopf(){ return { 'Content-Type':'application/json', 'X-Admin-Secret': SECRET }; }

function toast(txt){
  const t = document.getElementById('toast');
  t.textContent = txt; t.style.display = 'block';
  setTimeout(()=>{ t.style.display = 'none'; }, 2600);
}

async function anmelden(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('loginErr');
  if(!pw){ err.textContent='Bitte Passwort eingeben.'; err.style.display='block'; return; }
  SECRET = pw;
  const r = await fetch('/api/admin/stats', { headers: kopf() });
  if(r.status === 401){
    err.textContent = 'Passwort falsch.'; err.style.display='block'; SECRET=''; return;
  }
  if(r.status === 503){
    err.textContent = 'Keine Datenbank verbunden. DATABASE_URL in Railway prüfen.'; err.style.display='block'; SECRET=''; return;
  }
  if(!r.ok){ err.textContent='Serverfehler ('+r.status+').'; err.style.display='block'; SECRET=''; return; }
  sessionStorage.setItem('kfzgut_admin', SECRET);
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  ladeAlles();
}

function abmelden(){
  sessionStorage.removeItem('kfzgut_admin'); SECRET='';
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('pw').value='';
}

function datum(s){
  if(!s) return '–';
  return new Date(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});
}
function tageBis(s){
  if(!s) return null;
  return Math.ceil((new Date(s) - new Date()) / 86400000);
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function ladeStats(){
  const r = await fetch('/api/admin/stats',{headers:kopf()});
  if(!r.ok) return;
  const s = await r.json();
  document.getElementById('kacheln').innerHTML = `
    <div class="kachel akzent"><div class="k-label">Zahlende Kunden</div><div class="k-zahl">${s.zahlend}</div></div>
    <div class="kachel akzent"><div class="k-label">MRR</div><div class="k-zahl">${s.mrr} €</div></div>
    <div class="kachel"><div class="k-label">Launch-Plätze frei</div><div class="k-zahl">${s.launch_plaetze_frei}</div></div>
    <div class="kachel"><div class="k-label">Im Test</div><div class="k-zahl">${s.im_test}</div></div>
    <div class="kachel warn"><div class="k-label">Test endet in 2 T.</div><div class="k-zahl">${s.test_endet_bald}</div></div>
    <div class="kachel"><div class="k-label">Neu (7 Tage)</div><div class="k-zahl">${s.neu_7t}</div></div>
    <div class="kachel"><div class="k-label">Unbestätigt</div><div class="k-zahl">${s.unbestaetigt}</div></div>
    <div class="kachel"><div class="k-label">Prüfungen gesamt</div><div class="k-zahl">${s.pruefungen}</div></div>`;
}

async function ladeUsers(){
  const q = encodeURIComponent(document.getElementById('suche').value);
  const r = await fetch(`/api/admin/users?q=${q}&filter=${FILTER}`,{headers:kopf()});
  const tb = document.getElementById('tbody');
  if(!r.ok){ tb.innerHTML='<tr><td colspan="8" class="leer">Fehler beim Laden.</td></tr>'; return; }
  const { users } = await r.json();
  if(!users.length){ tb.innerHTML='<tr><td colspan="8" class="leer">Keine Nutzer gefunden.</td></tr>'; return; }

  tb.innerHTML = users.map(u => {
    const planB = u.plan==='aktiv' ? '<span class="badge b-gruen">Zahlend</span>'
                : u.plan==='trial' ? '<span class="badge b-gelb">Test</span>'
                : '<span class="badge b-grau">Beendet</span>';
    const statB = u.plan_status==='gesperrt'
                ? '<span class="badge b-rot">Gesperrt</span>'
                : '<span class="badge b-gruen">Aktiv</span>';
    const mailB = u.email_verified
                ? '<span class="badge b-gruen">Bestätigt</span>'
                : '<span class="badge b-rot">Offen</span>';
    const t = tageBis(u.trial_ends_at);
    let trialTxt = '–';
    if(u.trial_ends_at){
      trialTxt = t < 0 ? `<span class="badge b-rot">abgelaufen</span>`
               : t <= 2 ? `<span class="badge b-gelb">${t} Tage</span>`
               : `<span class="zeit">${datum(u.trial_ends_at)}</span>`;
    }
    const launch = u.launch_preis ? ' <span class="badge b-grau">79 €</span>' : '';
    return `<tr>
      <td><div class="email">${esc(u.email)}</div><div class="sub">${esc(u.firma || u.name || '—')}${launch}</div></td>
      <td>${planB}</td><td>${statB}</td><td>${mailB}</td>
      <td>${trialTxt}</td>
      <td class="zeit">${u.pruefungen_gesamt}</td>
      <td class="zeit">${datum(u.created_at)}</td>
      <td><button class="btn-ghost" onclick='oeffne(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Bearbeiten</button></td>
    </tr>`;
  }).join('');
}

function ladeAlles(){ ladeStats(); ladeUsers(); }
function entprellt(){ clearTimeout(timer); timer = setTimeout(ladeUsers, 300); }
function setFilter(f){
  FILTER = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  ladeUsers();
}

function oeffne(u){
  AKTUELL = u;
  document.getElementById('mMail').textContent = u.email;
  document.getElementById('mPlan').value = u.plan;
  document.getElementById('mStatus').value = u.plan_status;
  document.getElementById('mFirma').value = u.firma || '';
  document.getElementById('mNotiz').value = u.notiz || '';
  document.getElementById('mVerified').checked = !!u.email_verified;
  document.getElementById('mLaunch').checked = !!u.launch_preis;
  document.getElementById('overlay').classList.add('on');
}
function zuMachen(){ document.getElementById('overlay').classList.remove('on'); AKTUELL = null; }

async function speichern(){
  if(!AKTUELL) return;
  const body = {
    plan: document.getElementById('mPlan').value,
    plan_status: document.getElementById('mStatus').value,
    firma: document.getElementById('mFirma').value,
    notiz: document.getElementById('mNotiz').value,
    email_verified: document.getElementById('mVerified').checked ? 1 : 0,
    launch_preis: document.getElementById('mLaunch').checked ? 1 : 0
  };
  const r = await fetch(`/api/admin/users/${AKTUELL.id}`,{method:'PATCH',headers:kopf(),body:JSON.stringify(body)});
  if(r.ok){ toast('Gespeichert.'); zuMachen(); ladeAlles(); }
  else toast('Fehler beim Speichern.');
}

async function trialVerlaengern(){
  if(!AKTUELL) return;
  const tage = parseInt(document.getElementById('mTage').value, 10);
  const r = await fetch(`/api/admin/users/${AKTUELL.id}/trial`,{method:'POST',headers:kopf(),body:JSON.stringify({tage})});
  if(r.ok){ toast(`Test um ${tage} Tage verlängert.`); zuMachen(); ladeAlles(); }
  else toast('Fehler beim Verlängern.');
}

async function loeschen(){
  if(!AKTUELL) return;
  if(!confirm(`Nutzer ${AKTUELL.email} endgültig löschen?`)) return;
  const r = await fetch(`/api/admin/users/${AKTUELL.id}`,{method:'DELETE',headers:kopf()});
  if(r.ok){ toast('Gelöscht.'); zuMachen(); ladeAlles(); }
  else toast('Fehler beim Löschen.');
}

document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') anmelden(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') zuMachen(); });
if(SECRET) anmelden();
</script>
</body>
</html>
