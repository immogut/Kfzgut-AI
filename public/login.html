<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden — KfzGut-AI</title>
<link rel="stylesheet" href="/stil.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.box{width:100%;max-width:420px}
.box .karte{box-shadow:0 20px 44px -22px rgba(27,37,48,.3)}
.tabs{display:flex;gap:6px;background:#EEF0F1;padding:5px;border-radius:8px;margin-bottom:24px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;border-radius:6px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--stahl-70)}
.tabs button.on{background:#fff;color:var(--stahl);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kopfzeile{text-align:center;margin-bottom:26px}
.kopfzeile .logo{justify-content:center;margin-bottom:8px}
.kopfzeile p{color:var(--stahl-70);font-size:14.5px}
.klein{font-size:13px;color:var(--stahl-70);text-align:center;margin-top:16px}
.klein a{cursor:pointer}
.zurueck{display:block;text-align:center;margin-top:18px;font-size:13.5px;color:var(--stahl-70);text-decoration:none}
.hinweis{font-size:12.5px;color:var(--stahl-70);margin-top:-8px;margin-bottom:16px}
</style>
</head>
<body>
<div class="box">
  <div class="kopfzeile">
    <a class="logo" href="/"><span class="mark"></span>KfzGut<span class="ai">-AI</span></a>
    <p>Der Prüfassistent für Kfz-Schadengutachten</p>
  </div>

  <div class="karte">
    <div class="tabs" id="tabs">
      <button class="on" onclick="zeige('login')">Anmelden</button>
      <button onclick="zeige('reg')">Registrieren</button>
    </div>

    <div class="meldung" id="meldung"></div>

    <!-- Login -->
    <div id="f-login">
      <div class="feld"><label for="lMail">E-Mail</label><input type="email" id="lMail" autocomplete="email"></div>
      <div class="feld"><label for="lPw">Passwort</label><input type="password" id="lPw" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-voll" id="lBtn" onclick="login()">Anmelden</button>
      <p class="klein"><a onclick="zeige('vergessen')">Passwort vergessen?</a></p>
    </div>

    <!-- Registrierung -->
    <div id="f-reg" style="display:none">
      <div class="feld"><label for="rFirma">Büro / Name</label><input type="text" id="rFirma" autocomplete="organization"></div>
      <div class="feld"><label for="rMail">E-Mail</label><input type="email" id="rMail" autocomplete="email"></div>
      <div class="feld"><label for="rPw">Passwort</label><input type="password" id="rPw" autocomplete="new-password"></div>
      <p class="hinweis">Mindestens 8 Zeichen.</p>
      <button class="btn btn-primary btn-voll" id="rBtn" onclick="registrieren()">7 Tage kostenlos testen</button>
      <p class="klein">Keine Kreditkarte nötig. Mit der Registrierung stimmst du den
        <a href="/agb.html">AGB</a> und der <a href="/datenschutz.html">Datenschutzerklärung</a> zu.</p>
    </div>

    <!-- Passwort vergessen -->
    <div id="f-vergessen" style="display:none">
      <div class="feld"><label for="vMail">E-Mail</label><input type="email" id="vMail" autocomplete="email"></div>
      <button class="btn btn-primary btn-voll" onclick="vergessen()">Link anfordern</button>
      <a class="zurueck" onclick="zeige('login')">Zurück zur Anmeldung</a>
    </div>
  </div>

  <p class="klein" style="margin-top:20px">
    <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a> · <a href="/agb.html">AGB</a>
  </p>
</div>

<script>
function melde(txt, art){
  const m = document.getElementById('meldung');
  m.className = 'meldung zeigen m-' + art;
  m.textContent = txt;
}
function versteckeMeldung(){ document.getElementById('meldung').className = 'meldung'; }

function zeige(was){
  versteckeMeldung();
  for (const id of ['login','reg','vergessen']) {
    document.getElementById('f-' + id).style.display = (id === was) ? 'block' : 'none';
  }
  const btns = document.querySelectorAll('#tabs button');
  btns[0].classList.toggle('on', was === 'login' || was === 'vergessen');
  btns[1].classList.toggle('on', was === 'reg');
}

async function login(){
  const btn = document.getElementById('lBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('lMail').value,
        passwort: document.getElementById('lPw').value
      })
    });
    const d = await r.json();
    if(!r.ok){
      melde(d.error || 'Anmeldung fehlgeschlagen.', 'fehler');
      if(d.unbestaetigt) erneutSenden(document.getElementById('lMail').value);
      return;
    }
    localStorage.setItem('kfzgut_token', d.token);
    location.href = '/app.html';
  } catch { melde('Verbindung fehlgeschlagen.', 'fehler'); }
  finally { btn.disabled = false; }
}

async function registrieren(){
  const btn = document.getElementById('rBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('rMail').value,
        passwort: document.getElementById('rPw').value,
        firma: document.getElementById('rFirma').value
      })
    });
    const d = await r.json();
    if(!r.ok){ melde(d.error || 'Registrierung fehlgeschlagen.', 'fehler'); return; }
    zeige('login');
    melde('Fast geschafft — bitte bestätige jetzt die E-Mail, die wir dir geschickt haben.', 'ok');
  } catch { melde('Verbindung fehlgeschlagen.', 'fehler'); }
  finally { btn.disabled = false; }
}

async function erneutSenden(mail){
  await fetch('/api/resend-verify', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email: mail })
  });
}

async function vergessen(){
  await fetch('/api/passwort-vergessen', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email: document.getElementById('vMail').value })
  });
  zeige('login');
  melde('Falls die Adresse bei uns hinterlegt ist, findest du gleich eine E-Mail im Postfach.', 'ok');
}

// Rückmeldungen aus dem Verifizierungs-Link
const p = new URLSearchParams(location.search);
if(p.get('bestaetigt')) melde('E-Mail bestätigt. Du kannst dich jetzt anmelden.', 'ok');
if(p.get('fehler') === 'token') melde('Dieser Bestätigungslink ist ungültig oder wurde schon verwendet.', 'fehler');
if(localStorage.getItem('kfzgut_token')) location.href = '/app.html';

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(document.getElementById('f-login').style.display !== 'none') login();
  else if(document.getElementById('f-reg').style.display !== 'none') registrieren();
});
</script>
</body>
</html>
